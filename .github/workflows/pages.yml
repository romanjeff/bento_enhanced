# Deploys web/ (the browser patcher, docs/web-patcher.md) to GitHub Pages.
# INERT until the repository variable PAGES_ENABLED is set to "true" (Settings > Secrets and variables >
# Actions > Variables) and Pages' source is "GitHub Actions" (Settings > Pages). Until then every run is skipped.
# Deploys only by hand (Actions > Pages (web patcher) > Run workflow), from main, AFTER the local check:
# CI has no stock firmware, so it cannot check the zero-stock-bytes rule itself; tools/test_web_patch.py, run
# locally against stock, is that check (docs/web-patcher.md, "Deploying").
name: Pages (web patcher)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A release not yet device_tested is allowed only as a labelled test build: device_tested false in
      # release_hashes.json, index.json and its patch alike, test_build in index.json, kit name ...-UNTESTED,
      # and never the default (which must be a device-tested release).
      - name: Refuse to publish firmware, or an untested release that is not a labelled test build
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          web = pathlib.Path("web")
          allowed = {".html", ".js", ".css", ".json"}
          files = [p for p in web.rglob("*") if p.is_file()]
          bad = [str(p) for p in files if p.suffix.lower() not in allowed]
          big = [str(p) for p in files if p.stat().st_size > 1024 * 1024]
          if bad: sys.exit(f"files in web/ that are not .html/.js/.css/.json: {bad}")
          if big: sys.exit(f"unexpectedly large files in web/ (a patch is ~200 KB): {big}")
          d = web / "patches"
          idx = json.loads((d / "index.json").read_text())
          db = json.loads(pathlib.Path("tools/release_hashes.json").read_text())
          firmware = set(idx["known_sha256"]) | set(idx["stock_sha256"].values())
          for s in db["stock"].values(): firmware |= set(s.values())
          for r in db["releases"].values(): firmware.add(r["bento1.bin"])
          for p in files:
              if hashlib.sha256(p.read_bytes()).hexdigest() in firmware: sys.exit(f"{p} is a firmware file")
          assert idx["format"] == "bento_enhanced-webpatch", "index format"
          assert idx["stock_sha256"] == db["stock"][idx["base"]], "index stock hashes != tools/release_hashes.json"
          tested = [r["version"] for r in idx["releases"] if db["releases"].get(r["version"], {}).get("device_tested") is True]
          assert idx["default"] in tested, f"index default v{idx['default']} is not a device-tested release"
          listed = set()
          for r in idx["releases"]:
              v = r["version"]
              assert v not in listed, f"v{v} listed twice"
              listed.add(v)
              p = json.loads((d / r["file"]).read_text())
              rel = db["releases"].get(v)
              assert rel is not None, f"v{v} not in tools/release_hashes.json"
              t = rel.get("device_tested")
              if t is True:
                  assert r.get("device_tested") is True and p.get("device_tested") is True, f"v{v}: not device_tested"
                  assert "test_build" not in r, f"v{v}: device-tested but marked test_build"
              elif t is False:
                  assert r.get("device_tested") is False and p.get("device_tested") is False, \
                      f"v{v}: release_hashes.json, index.json and the patch disagree on device_tested"
                  assert r.get("test_build") is True, f"v{v}: untested but not marked test_build in index.json"
                  assert idx["default"] != v, f"v{v}: an untested test build is the default"
                  assert p["kit"]["name"].endswith("-UNTESTED"), f"v{v}: test build kit name lacks -UNTESTED"
              else:
                  sys.exit(f"v{v}: device_tested in release_hashes.json is neither true nor false ({t!r})")
              assert p["format"] == "bento_enhanced-webpatch" and p["version"] == r["version"], r
              assert p["output_sha256"] == r["output_sha256"] == rel["bento1.bin"], f"v{r['version']}: sha != published"
              assert p["min_copy"] >= 8, "zero-stock-bytes N below the documented policy"
              assert {op[0] for op in p["ops"]} <= {"W", "C", "D", "F"}, "unknown op"
          print("patches:", [r["version"] + ("" if r["device_tested"] is True else " (TEST BUILD)") for r in idx["releases"]],
                "default:", idx["default"])
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
