# Deploys web/ (the browser patcher, docs/web-patcher.md) to GitHub Pages.
# INERT until the repository variable PAGES_ENABLED is set to "true" (Settings > Secrets and variables >
# Actions > Variables) and Pages' source is "GitHub Actions" (Settings > Pages). Until then every run is skipped.
# web/ holds only our own bytes; the guard step refuses firmware-like or unexpectedly large files.
name: Pages (web patcher)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish firmware
        run: |
          bad=$(find web -type f \( -iname '*.bin' -o -iname '*.zip' -o -iname '*.hex' -o -iname '*.dfu' -o -iname '*.elf' \) -print)
          if [ -n "$bad" ]; then echo "firmware-like files in web/: $bad"; exit 1; fi
          big=$(find web -type f -size +1M -print)
          if [ -n "$big" ]; then echo "unexpectedly large files in web/ (a patch is ~200 KB): $big"; exit 1; fi
          python3 - <<'PY'
          import json, pathlib
          d = pathlib.Path("web/patches")
          idx = json.loads((d / "index.json").read_text())
          assert idx["format"] == "bento_enhanced-webpatch", "index format"
          for r in idx["releases"]:
              p = json.loads((d / r["file"]).read_text())
              assert p["format"] == "bento_enhanced-webpatch" and p["version"] == r["version"], r
              assert p["output_sha256"] == r["output_sha256"], r
              assert p["min_copy"] >= 8, "zero-stock-bytes N below the documented policy"
          print("patches:", [r["version"] for r in idx["releases"]])
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
